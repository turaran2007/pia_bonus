# このファイルを secret.yaml にコピーして値を入れてから適用してください。
# secret.yaml は .gitignore 済みです（トークンをコミットしないため）。
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pia-bonus
  namespace: pia-bonus
type: Opaque
stringData:
  BOT_TOKEN: "ここに Discord の Bot トークン"
  POSTGRES_PASSWORD: "ここに十分長いランダムな文字列（例: openssl rand -hex 24 の出力）"
